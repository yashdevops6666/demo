apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dietly-ingress
  namespace: dietly
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  tls:
    - hosts:
        - dietly.app
      secretName: dietly-tls
  rules:
    - host: dietly.app
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: dietly-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dietly-frontend
                port:
                  number: 80
