apiVersion: apps/v1
kind: Deployment
metadata:
  name: dietly-frontend
  namespace: dietly
  labels:
    app: dietly-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dietly-frontend
  template:
    metadata:
      labels:
        app: dietly-frontend
    spec:
      containers:
        - name: frontend
          image: FRONTEND_IMAGE_TAG      # replaced by Jenkins sed
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
      imagePullSecrets:
        - name: acr-secret
