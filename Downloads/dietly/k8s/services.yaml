apiVersion: v1
kind: Service
metadata:
  name: dietly-backend
  namespace: dietly
spec:
  selector:
    app: dietly-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: dietly-frontend
  namespace: dietly
spec:
  selector:
    app: dietly-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
