apiVersion: apps/v1
kind: Deployment
metadata:
  name: dietly-backend
  namespace: dietly
  labels:
    app: dietly-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dietly-backend
  template:
    metadata:
      labels:
        app: dietly-backend
    spec:
      containers:
        - name: backend
          image: BACKEND_IMAGE_TAG       # replaced by Jenkins sed
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dietly-secrets
                  key: ANTHROPIC_API_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dietly-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      imagePullSecrets:
        - name: acr-secret
